name: Fitrah Launcher Multiplatform Release

on:
  pull_request:
    branches: [master]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Restore stable owner-preview Android signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
        run: |
          if [[ -z "$ANDROID_PREVIEW_KEYSTORE_B64" ]]; then
            echo 'ANDROID_PREVIEW_KEYSTORE_B64 secret is required for tagged/manual owner-preview builds.' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Verify owner-preview signing key
        if: github.event_name != 'pull_request'
        run: |
          fingerprint="$(keytool -list -v -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | awk -F ': ' '/SHA256:/{gsub(":", "", $2); print tolower($2)}')"
          if [[ "$fingerprint" != "b8af9d95bd72793e817c2bec78f3e1360d96456ef47db5260ed0d5a19934fe3e" ]]; then
            echo "Owner-preview keystore fingerprint mismatch: $fingerprint" >&2
            exit 1
          fi
      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Verify owner-preview APK signature
        if: github.event_name != 'pull_request'
        run: |
          sdk_dir="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_dir/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          fingerprint="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}')"
          if [[ "$fingerprint" != "b8af9d95bd72793e817c2bec78f3e1360d96456ef47db5260ed0d5a19934fe3e" ]]; then
            echo "Owner-preview APK fingerprint mismatch: $fingerprint" >&2
            exit 1
          fi
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Linux
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Fitrah-Launcher-Linux-x64.tar.gz .
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Linux-x64
          path: Fitrah-Launcher-Linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Windows
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Fitrah-Launcher-Windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Windows-x64
          path: Fitrah-Launcher-Windows-x64.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Fitrah, Focus Clock and Sadar
        run: |
          npm run build:fitrah -- --output=build/web/fitrah
          npm run build:focus -- --output=build/web/focus
          npm run build:sadar -- --output=build/web/sadar
          (cd build/web/fitrah && zip -qr ../../../Fitrah-Launcher-Web-Fitrah.zip .)
          (cd build/web/focus && zip -qr ../../../Fitrah-Launcher-Web-Focus-Clock.zip .)
          (cd build/web/sadar && zip -qr ../../../Fitrah-Launcher-Web-Sadar.zip .)
      - name: Upload Fitrah Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Web-Fitrah
          path: Fitrah-Launcher-Web-Fitrah.zip
      - name: Upload Focus Clock Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Web-Focus-Clock
          path: Fitrah-Launcher-Web-Focus-Clock.zip
      - name: Upload Sadar Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Web-Sadar
          path: Fitrah-Launcher-Web-Sadar.zip
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-linux, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv release-assets/Fitrah-Launcher-Android-APK/app-release.apk release-assets/Fitrah-Launcher-Android-APK.apk
          mv release-assets/Fitrah-Launcher-Linux-x64/Fitrah-Launcher-Linux-x64.tar.gz release-assets/Fitrah-Launcher-Linux-x64.tar.gz
          mv release-assets/Fitrah-Launcher-Windows-x64/Fitrah-Launcher-Windows-x64.zip release-assets/Fitrah-Launcher-Windows-x64.zip
          mv release-assets/Fitrah-Launcher-Web-Fitrah/Fitrah-Launcher-Web-Fitrah.zip release-assets/Fitrah-Launcher-Web-Fitrah.zip
          mv release-assets/Fitrah-Launcher-Web-Focus-Clock/Fitrah-Launcher-Web-Focus-Clock.zip release-assets/Fitrah-Launcher-Web-Focus-Clock.zip
          mv release-assets/Fitrah-Launcher-Web-Sadar/Fitrah-Launcher-Web-Sadar.zip release-assets/Fitrah-Launcher-Web-Sadar.zip
          cd release-assets
          sha256sum Fitrah-Launcher-Android-APK.apk Fitrah-Launcher-Linux-x64.tar.gz Fitrah-Launcher-Windows-x64.zip Fitrah-Launcher-Web-Fitrah.zip Fitrah-Launcher-Web-Focus-Clock.zip Fitrah-Launcher-Web-Sadar.zip > SHA256SUMS.txt
          gh release create "$TAG_NAME" \
            Fitrah-Launcher-Android-APK.apk \
            Fitrah-Launcher-Linux-x64.tar.gz \
            Fitrah-Launcher-Windows-x64.zip \
            Fitrah-Launcher-Web-Fitrah.zip \
            Fitrah-Launcher-Web-Focus-Clock.zip \
            Fitrah-Launcher-Web-Sadar.zip \
            SHA256SUMS.txt \
            --verify-tag --title "Fitrah Launcher $TAG_NAME — Ecosystem Preview" --generate-notes --prerelease
