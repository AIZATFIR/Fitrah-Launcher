name: Fitrah Launcher Multiplatform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Linux
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Fitrah-Launcher-Linux-x64.tar.gz .
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Linux-x64
          path: Fitrah-Launcher-Linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Windows
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          flutter build windows --release
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Fitrah-Launcher-Windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Windows-x64
          path: Fitrah-Launcher-Windows-x64.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - name: Build Web
        run: |
          flutter build web --release
          cd build/web && zip -r ../../Fitrah-Launcher-Web.zip .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitrah-Launcher-Web
          path: Fitrah-Launcher-Web.zip
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-linux, build-windows, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv release-assets/Fitrah-Launcher-Android-APK/app-release.apk release-assets/Fitrah-Launcher-Android-APK.apk
          mv release-assets/Fitrah-Launcher-Linux-x64/Fitrah-Launcher-Linux-x64.tar.gz release-assets/Fitrah-Launcher-Linux-x64.tar.gz
          mv release-assets/Fitrah-Launcher-Windows-x64/Fitrah-Launcher-Windows-x64.zip release-assets/Fitrah-Launcher-Windows-x64.zip
          mv release-assets/Fitrah-Launcher-Web/Fitrah-Launcher-Web.zip release-assets/Fitrah-Launcher-Web.zip
          gh release create "$TAG_NAME" \
            release-assets/Fitrah-Launcher-Android-APK.apk \
            release-assets/Fitrah-Launcher-Linux-x64.tar.gz \
            release-assets/Fitrah-Launcher-Windows-x64.zip \
            release-assets/Fitrah-Launcher-Web.zip \
            --verify-tag --title "Fitrah Launcher $TAG_NAME — Ecosystem Preview" --generate-notes --prerelease
